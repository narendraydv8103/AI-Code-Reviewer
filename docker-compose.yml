services:
  ai-code-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ANALYZERS: "false"
    image: ai-code-reviewer:latest
    container_name: ai-code-reviewer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - reviewer-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  reviewer-data:
    name: ai_code_reviewer_data
